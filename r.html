<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📟 테니스메이트 리모컨</title>
<meta name="robots" content="noindex">
<style>

  #join button { background: #2f9e5f; color: #fff; font-size: 16px; padding: 9px 22px; }

  #code-box { display: none; gap: 8px; }

</head>

    <div id="msg">점수판 폰의 리모컨 코드를 넣으세요</div>
  </div>
  <button class="sub" id="code-tog" onclick="codeMode()">코드로 연결</button>
  <button class="sub" id="solo-btn" onclick="soloStart()">코드 없이 워치로만 세기</button>
</div>
<div id="play">
  <div id="score" onclick="speakNow()" title="탭하면 점수를 읽어줘요">
    <div id="sets"></div>
    <div id="games"><i></i>게임 <span class="g0">0</span> - <span class="g1">0</span></div>
    <div id="pts"><span class="p0">0</span><span class="colon">:</span><span class="p1">0</span></div>
    <div id="state"></div>
  </div>
  <button class="full-btn" id="btn-us" onclick="sendPoint(0)">🟢 우리</button>
  <button class="full-btn" id="btn-them" onclick="sendPoint(1)">🔴 상대</button>
  <div id="foot">
    <button onclick="sendUndo()">되돌리기</button>
    <button id="voice-btn" onclick="toggleVoice()">음성</button>
    <button onclick="menuOpen()">메뉴</button>
  </div>
</div>
<div id="menu" class="ov">
  <button class="pri" onclick="menuClose()">닫기</button>
  <div class="s" id="menu-info"></div>
  <button id="m-phone" onclick="menuPhone()">폰 점수로 맞추기</button>
  <button id="m-new" onclick="menuNew()">새 경기 (0:0)</button>
  <button id="m-gt" onclick="menuFmt('gT')"></button>
  <button id="m-sn" onclick="menuFmt('sNeed')"></button>
  <button id="m-ad" onclick="menuFmt('noAd')"></button>
  <button id="m-srv" onclick="menuSrv()"></button>
  <button id="m-link" onclick="menuLink()"></button>
</div>
<div id="ask" class="ov">
  <div class="t">폰 점수와 달라요</div>
  <div class="s" id="ask-phone"></div>
  <div class="s" id="ask-watch"></div>
  <button onclick="askPick('keep')">워치 점수 그대로 (폰과 따로)</button>
  <button class="pri" id="ask-send" onclick="askPick('send')">워치 점수를 폰에 보내기</button>
  <button onclick="askPick('phone')">폰 점수 쓰기</button>
</div>
